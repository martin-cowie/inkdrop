[package]
name = "inkdrop"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["multipart"] }
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
futures-util = "0.3.34"
http = "1.5.0"
ipp = "7.0.0"
mdns-sd = "0.21.3"
pdfium-render = "0.9.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tokio-util = { version = "0.7.19", features = ["io", "compat"] }
tower-http = { version = "0.7.1", features = ["fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.26.1", features = ["v4"] }

# Release builds favour a small executable. Panics still unwind (no
# `panic = "abort"`), so a panic in one request or task doesn't kill the server.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
